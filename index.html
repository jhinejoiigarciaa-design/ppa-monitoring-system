<!DOCTYPE html>
<html>
<head>
  <title>PPA Monitoring System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <style>
    body{
      font-family:'Segoe UI', Arial, sans-serif;
      background:#eef2f7;
      padding:15px;
      margin:0;
    }

    h1{
      text-align:center;
      margin-bottom:15px;
      color:#2c3e50;
      font-size:28px;
    }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:10px;
      margin-bottom:15px;
    }

    .card{
      padding:12px;
      color:white;
      border-radius:10px;
      text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3{
      margin:6px 0 0;
      font-size:22px;
    }

    .total{background:#34495e;}
    .completed{background:#27ae60;}
    .ongoing{background:#f39c12;}
    .pipeline{background:#e74c3c;}
    .forimpl{background:#6c5ce7;}
    .util{background:#16a085;}
    .unutil{background:#c0392b;}

    .formbox{
      background:white;
      padding:10px;
      border-radius:10px;
      margin-bottom:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    input,select,button{
      padding:8px;
      margin:4px;
      border-radius:6px;
      border:1px solid #ccc;
      font-size:14px;
    }

    button{
      cursor:pointer;
      border:none;
      background:#2c3e50;
      color:white;
      padding:9px 14px;
    }

    button:hover{
      opacity:0.9;
    }

    .chart-wrap{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-bottom:15px;
    }

    .chart-box{
      background:white;
      border-radius:12px;
      padding:15px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
      min-height:360px;
    }

    .chart-title{
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
      color:#2c3e50;
    }

    .chart-canvas-wrap{
      position:relative;
      width:100%;
      height:300px;
    }

    table{
      width:100%;
      background:white;
      border-radius:10px;
      border-collapse:collapse;
      overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    th,td{
      padding:10px;
      text-align:center;
      border-bottom:1px solid #ddd;
      font-size:14px;
    }

    th{
      background:#2c3e50;
      color:white;
    }

    .progress{
      background:#ddd;
      height:8px;
      border-radius:8px;
      overflow:hidden;
      margin-bottom:4px;
    }

    .progress-bar{
      height:8px;
      background:#27ae60;
      border-radius:8px;
    }

    .action-buttons button{
      margin:2px;
      padding:7px 10px;
      font-size:12px;
    }

    @media(max-width:900px){
      .chart-wrap{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <h1>Pasig City Anti-Drug Abuse Office PPA Monitoring System</h1>

  <div class="dashboard">
    <div class="card total">TOTAL<h3 id="total">0</h3></div>
    <div class="card completed">COMPLETED<h3 id="completed">0</h3></div>
    <div class="card ongoing">ONGOING<h3 id="ongoing">0</h3></div>
    <div class="card pipeline">PIPELINE<h3 id="pipeline">0</h3></div>
    <div class="card forimpl">FOR IMP<h3 id="forimpl">0</h3></div>
    <div class="card util">UTILIZED<h3 id="utilized">0</h3></div>
    <div class="card unutil">UNUTILIZED<h3 id="unutilized">0</h3></div>
  </div>

  <div class="formbox">
    <input id="code" placeholder="Code">
    <input id="desc" placeholder="Description">
    <input id="budget" type="number" placeholder="Budget">
    <input id="progress" type="number" placeholder="Progress %">

    <select id="status" onchange="autoProgress()">
      <option>Completed</option>
      <option>Ongoing</option>
      <option>Pipeline</option>
      <option>For Implementation</option>
    </select>

    <select id="fund">
      <option>Utilized</option>
      <option>Unutilized</option>
    </select>

    <button id="saveBtn" onclick="quickAdd(true)">SAVE</button>
    <button onclick="cancelEdit()">CANCEL</button>
  </div>

  <div class="formbox">
    <input id="search" placeholder="Search">
    <button onclick="searchData()">Search</button>
    <button onclick="refreshTable()">Refresh</button>
  </div>

  <div class="chart-wrap">
    <div class="chart-box">
      <div class="chart-title">PPA Status Distribution</div>
      <div class="chart-canvas-wrap">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div class="chart-box">
      <div class="chart-title">Fund Utilization Distribution</div>
      <div class="chart-canvas-wrap">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <table id="ppaTable"></table>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyp48afWyRgSVsxaE80HFTccI77oW-ARxPi18-GxAyZkHw_9rUovuzt-JCo1fGqcKHSnA/exec";

    let allData = [];
    let editIndex = -1;
    let chart = null;
    let pieChart = null;

    function autoProgress() {
      if (document.getElementById("status").value === "Completed") {
        document.getElementById("progress").value = 100;
      }
    }

    async function quickAdd(saveToSheet = false) {
      const c = document.getElementById("code").value.trim();
      const d = document.getElementById("desc").value.trim();
      const b = document.getElementById("budget").value || 0;
      const s = document.getElementById("status").value;
      const p = (s === "Completed") ? 100 : Number(document.getElementById("progress").value || 0);
      const f = document.getElementById("fund").value;

      if (!c || !d) {
        alert("Please fill required fields");
        return;
      }

      if (!saveToSheet) return;

      let actionType = "addData";
      let paramsObj = {
        code: c,
        desc: d,
        budget: b,
        status: s,
        progress: p,
        fund: f
      };

      if (editIndex !== -1) {
        actionType = "updateData";
        const rowIndex = allData[editIndex][7];

        if (!rowIndex) {
          alert("Cannot update. Missing rowIndex");
          return;
        }

        paramsObj.rowIndex = rowIndex;
      }

      const params = new URLSearchParams({
        action: actionType,
        ...paramsObj
      });

      try {
        const res = await fetch(`${API_URL}?${params}`);
        const data = await res.json();

        if (data.status === "error") {
          alert("Error: " + data.message);
          return;
        }

        await loadFromSheet();
        clearForm();
        editIndex = -1;
        document.getElementById("saveBtn").innerText = "SAVE";

      } catch (e) {
        console.error(e);
        alert("Connection failed");
      }
    }

    function clearForm() {
      document.getElementById("code").value = "";
      document.getElementById("desc").value = "";
      document.getElementById("budget").value = "";
      document.getElementById("progress").value = "";
      document.getElementById("status").value = "Completed";
      document.getElementById("fund").value = "Utilized";
    }

    function cancelEdit() {
      editIndex = -1;
      clearForm();
      document.getElementById("saveBtn").innerText = "SAVE";
    }

    function editRow(i) {
      const r = allData[i];
      if (!r) return;

      document.getElementById("code").value = r[0] || "";
      document.getElementById("desc").value = r[1] || "";
      document.getElementById("budget").value = r[2] || "";
      document.getElementById("progress").value = r[4] || 0;

      const statusMap = {
        "completed": "Completed",
        "ongoing": "Ongoing",
        "pipeline": "Pipeline",
        "for implementation": "For Implementation"
      };

      const rawStatus = (r[3] || "").toLowerCase().trim();
      document.getElementById("status").value = statusMap[rawStatus] || "Ongoing";
      document.getElementById("fund").value = r[5] || "Unutilized";

      editIndex = i;
      document.getElementById("saveBtn").innerText = "UPDATE";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteRow(i) {
      if (!confirm("Delete?")) return;

      const rowIndex = allData[i][7];

      const params = new URLSearchParams({
        action: "deleteData",
        rowIndex: rowIndex
      });

      try {
        const res = await fetch(`${API_URL}?${params}`);
        const data = await res.json();

        if (data.status === "error") {
          alert("Delete failed: " + data.message);
          return;
        }

        await loadFromSheet();
        cancelEdit();

      } catch (e) {
        console.error(e);
        alert("Delete failed");
      }
    }

    function renderTable(data) {
      let html = `
        <tr>
          <th>Code</th>
          <th>Description</th>
          <th>Budget</th>
          <th>Status</th>
          <th>Progress</th>
          <th>Fund</th>
          <th>Action</th>
        </tr>
      `;

      data.forEach((r) => {
        const realIndex = allData.findIndex(x => x[7] === r[7]);

        html += `
          <tr>
            <td>${r[0] || ""}</td>
            <td>${r[1] || ""}</td>
            <td>${r[2] || ""}</td>
            <td>${r[3] || ""}</td>
            <td>
              <div class="progress">
                <div class="progress-bar" style="width:${r[4] || 0}%"></div>
              </div>
              ${r[4] || 0}%
            </td>
            <td>${r[5] || ""}</td>
            <td class="action-buttons">
              <button onclick="editRow(${realIndex})">Edit</button>
              <button onclick="deleteRow(${realIndex})">Del</button>
            </td>
          </tr>
        `;
      });

      document.getElementById("ppaTable").innerHTML = html;
    }

    function refreshTable() {
      renderTable(allData);

      let counts = {
        total: allData.length,
        completed: 0,
        ongoing: 0,
        pipeline: 0,
        forimpl: 0,
        utilized: 0,
        unutilized: 0
      };

      allData.forEach(r => {
        const s = (r[3] || "").toString().toLowerCase().trim();
        const f = (r[5] || "").toString().toLowerCase().trim();

        if (s === "completed") counts.completed++;
        else if (s === "ongoing") counts.ongoing++;
        else if (s === "pipeline") counts.pipeline++;
        else if (s === "for implementation") counts.forimpl++;

        if (f === "utilized") counts.utilized++;
        else if (f === "unutilized") counts.unutilized++;
      });

      Object.keys(counts).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = counts[id];
      });

      drawChart(counts);
    }

    function drawChart(c) {
      const barCanvas = document.getElementById("chart");
      const pieCanvas = document.getElementById("pieChart");

      const statusData = [c.completed, c.ongoing, c.pipeline, c.forimpl];
      const fundData = [c.utilized, c.unutilized];

      const totalStatus = statusData.reduce((a, b) => a + b, 0);
      const totalFunds = fundData.reduce((a, b) => a + b, 0);

      if (chart) chart.destroy();
      chart = new Chart(barCanvas, {
        type: "bar",
        data: {
          labels: ["Completed", "Ongoing", "Pipeline", "For Impl"],
          datasets: [{
            label: "PPA Count",
            data: statusData,
            backgroundColor: ["#27ae60", "#f39c12", "#e74c3c", "#6c5ce7"],
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 30
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const value = context.raw;
                  const percent = totalStatus ? ((value / totalStatus) * 100).toFixed(1) : 0;
                  return `${value} project(s) - ${percent}%`;
                }
              }
            },
            datalabels: {
              anchor: "end",
              align: "top",
              offset: 4,
              color: "#2c3e50",
              font: {
                weight: "bold",
                size: 11
              },
              formatter: function(value) {
                const percent = totalStatus ? ((value / totalStatus) * 100).toFixed(1) : 0;
                return value + " (" + percent + "%)";
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });

      if (pieChart) pieChart.destroy();
      pieChart = new Chart(pieCanvas, {
        type: "pie",
        data: {
          labels: ["Utilized", "Unutilized"],
          datasets: [{
            data: fundData,
            backgroundColor: ["#16a085", "#c0392b"]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom"
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const value = context.raw;
                  const percent = totalFunds ? ((value / totalFunds) * 100).toFixed(1) : 0;
                  return `${context.label}: ${value} (${percent}%)`;
                }
              }
            },
            datalabels: {
              color: "#fff",
              font: {
                weight: "bold",
                size: 12
              },
              formatter: function(value) {
                const percent = totalFunds ? ((value / totalFunds) * 100).toFixed(1) : 0;
                return percent + "%";
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function searchData() {
      const val = document.getElementById("search").value.toLowerCase().trim();

      if (!val) {
        renderTable(allData);
        return;
      }

      const filtered = allData.filter(r =>
        r.map(x => String(x)).join(" ").toLowerCase().includes(val)
      );

      renderTable(filtered);
    }

    async function loadFromSheet() {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        const result = await res.json();

        if (result.status === "success") {
          allData = result.data;
          refreshTable();
        } else {
          alert("Failed to load data");
        }
      } catch (e) {
        console.error(e);
        alert("Failed to load data from sheet");
      }
    }

    loadFromSheet();
  </script>
</body>
</html>
